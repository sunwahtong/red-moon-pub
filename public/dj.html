<!doctype html><html lang="hu"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Red Moon DJ Console</title><link rel="stylesheet" href="css/main.css"><link rel="stylesheet" href="css/dj.css"></head><body class="dj-page"><div class="noise"></div><header class="nav"><a class="brand" href="index.html"><span class="brand-mark">月</span><span>RED MOON <small>DJ CONSOLE</small></span></a><div class="staff-user" id="djUser"></div></header><main class="dj-shell"><div id="djLoginMsg" class="dj-login-msg">DJ Console betöltése…</div><section id="djApp" class="hidden"><div class="dj-top"><div><div class="kicker">RED MOON / PRIVATE DJ ACCESS</div><h1>DJ <em>CONSOLE</em></h1><p id="djWelcome"></p></div><button id="djLogout" class="btn btn-ghost">KIJELENTKEZÉS</button></div><div class="dj-grid"><section class="dj-panel panel"><div class="panel-head"><div><span>01 / BROADCAST</span><h2>LIVE CONTROL</h2></div><div id="djLiveState" class="dj-state">OFFLINE</div></div><div class="field"><label>SHOW CÍME</label><input id="showTitle" placeholder="Red Moon Friday Night"></div><div class="dj-buttons"><button id="goLive" class="btn btn-red">🔴 GO LIVE</button><button id="stopLive" class="btn btn-ghost">⏹ STOP LIVE</button></div><div class="dj-stat"><span>HALLGATÓK</span><b id="djListeners">0</b></div><div class="yt-wrap"><div id="djPlayer"></div></div></section><section class="dj-panel panel"><div class="panel-head"><div><span>02 / MUSIC QUEUE</span><h2>YouTube DJ</h2></div></div><form id="queueForm" class="queue-form"><input id="ytUrl" placeholder="YouTube / youtu.be / Shorts / playlist link" required><button class="btn btn-red" type="submit">+ HOZZÁADÁS</button></form><div id="queue" class="queue"></div></section></div><section class="dj-grid lower"><section class="dj-panel panel"><div class="panel-head"><div><span>03 / NAME REQUESTS</span><h2>Névjóváhagyás</h2></div></div><div id="nameRequests"></div></section><section class="dj-panel panel"><div class="panel-head"><div><span>04 / REQUESTS</span><h2>Zenekérések</h2></div><span id="requestCount" class="dj-state">0</span></div><div id="requests"></div></section></div><section class="dj-panel panel lower"><div class="panel-head"><div><span>05 / CHAT MODERATION</span><h2>Club Chat</h2></div></div><div id="djChat" class="dj-chat"></div><form id="djChatForm" class="chat-row"><input id="djChatText" placeholder="Üzenet a klubnak…" maxlength="500"><button class="btn btn-red" type="submit">KÜLDÉS</button></form></section></section></main><script src="js/dj.js?v=20.0"></script></body></html>
